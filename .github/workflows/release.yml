name: Release

on:
  push:
    tags: ["v*"]

# 同一个 tag 被重推时不并行跑两份，避免互相覆盖已发布的产物
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag 推送不触发 CI（ci.yml 只在 push master / pull_request 上跑），
  # 所以质量门禁必须在这里再跑一遍，否则测试挂了照样能发版
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION, Cargo.toml, tauri.conf.json and Cargo.lock
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build-macos:
    needs: gate
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build universal .app
        run: npx --yes @tauri-apps/cli@2.11.5 build --target universal-apple-darwin
      - name: Package .dmg and .app.zip
        run: |
          set -eu
          out=dist && mkdir -p "$out"
          app=target/universal-apple-darwin/release/bundle/macos/Firebee.app
          scripts/make-dmg.sh "$app" "$out/Firebee-${GITHUB_REF_NAME}-macos-universal.dmg"
          ditto -c -k --keepParent "$app" "$out/Firebee-${GITHUB_REF_NAME}-macos-universal.app.zip"
          (cd "$out" && shasum -a 256 * > SHA256SUMS.txt)
          ls -la "$out"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Firebee ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install (macOS, Intel & Apple Silicon)

            1. Download the `.dmg`, open it and drag **Firebee** to Applications.
            2. The build is unsigned and not notarized, so on first launch macOS may say the app is damaged or from an unidentified developer. Clear the quarantine flag once:

               ```bash
               xattr -dr com.apple.quarantine /Applications/Firebee.app
               ```

               On macOS 15 and later the old Control-click → Open trick no longer works; if you skip the command above, allow the app in System Settings → Privacy & Security → Open Anyway.

            Data lives in `~/Library/Application Support/firebee/`. Checksums are in `SHA256SUMS.txt`.
